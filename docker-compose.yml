services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keyhook
      POSTGRES_PASSWORD: keyhook
      POSTGRES_DB: keyhook
    ports:
      - '54329:5432' # non-default host port avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keyhook -d keyhook']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata: {}
